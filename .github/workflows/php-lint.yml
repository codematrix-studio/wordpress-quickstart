name: Проверки PHP и SCSS

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Проверить синтаксис PHP
        run: |
          find wp-content/themes/quickstart wp-content/plugins/quickstart-tools \
            -type f -name '*.php' -print0 |
            xargs -0 -n 1 php -l

  scss-check:
    name: Компиляция SCSS
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить Dart Sass
        run: npm install --global sass

      - name: Скомпилировать SCSS
        run: sass --no-source-map --style=expanded frontend/scss/main.scss /tmp/quickstart-main.css

      - name: Проверить актуальность CSS
        run: diff --unified=3 wp-content/themes/quickstart/assets/css/main.css /tmp/quickstart-main.css
