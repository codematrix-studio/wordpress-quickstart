name: Проверка синтаксиса PHP

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  php-lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Проверить синтаксис PHP
        run: |
          find wp-content/themes/quickstart wp-content/plugins/quickstart-tools \
            -type f -name '*.php' -print0 |
            xargs -0 -n 1 php -l
